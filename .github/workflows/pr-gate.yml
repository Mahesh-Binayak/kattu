name: PR Gate

on:
  workflow_call:
    inputs:
      # Override service root paths only if they are NOT at repo root
      JAVA_SERVICE_LOCATION:
        required: false
        type: string
        default: '.'
      GO_SERVICE_LOCATION:
        required: false
        type: string
        default: '.'
      NPM_SERVICE_LOCATION:
        required: false
        type: string
        default: '.'
      JAVA_VERSION:
        required: false
        type: number
        default: 21
      NODE_VERSION:
        required: false
        type: string
        default: '20'
      SCAN_SEVERITY:
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      trivy_comment_mode:
        description: '"full" = comment all current HIGH/CRITICAL; "diff" = comment only newly introduced ones'
        required: false
        type: string
        default: 'full'
    secrets:
      OSSRH_USER:
        required: false
      OSSRH_SECRET:
        required: false

jobs:
# ─────────────────────────────────────────────
# DETECT — Auto-detect which stacks are present
# Security jobs run in parallel with this.
# Coverage jobs wait for its output.
# ─────────────────────────────────────────────
  detect:
    name: Detect Stacks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_java:    ${{ steps.detect.outputs.has_java }}
      has_go:      ${{ steps.detect.outputs.has_go }}
      has_npm:     ${{ steps.detect.outputs.has_npm }}
      has_android: ${{ steps.detect.outputs.has_android }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Detect stacks
        id: detect
        run: |
          detect() { [ -n "$1" ] && echo "true" || echo "false"; }

          echo "has_java=$(detect "$(find . -maxdepth 5 -name 'pom.xml' -not -path '*/node_modules/*' | head -1)")" >> $GITHUB_OUTPUT
          echo "has_go=$(detect "$(find . -maxdepth 5 -name 'go.mod' -not -path '*/vendor/*' | head -1)")" >> $GITHUB_OUTPUT
          echo "has_npm=$(detect "$(find . -maxdepth 5 -name 'package.json' -not -path '*/node_modules/*' | head -1)")" >> $GITHUB_OUTPUT
          echo "has_android=$(detect "$(grep -rl 'com.android' --include='*.gradle' --include='*.gradle.kts' . 2>/dev/null | head -1)")" >> $GITHUB_OUTPUT
          echo "has_flutter=$(detect "$(grep -rl 'sdk: flutter' --include='pubspec.yaml' . 2>/dev/null | head -1)")" >> $GITHUB_OUTPUT

      - name: Print detected stacks
        run: |
          echo "Java:    ${{ steps.detect.outputs.has_java }}"
          echo "Go:      ${{ steps.detect.outputs.has_go }}"
          echo "npm:     ${{ steps.detect.outputs.has_npm }}"
          echo "Android: ${{ steps.detect.outputs.has_android }}"
          echo "Flutter: ${{ steps.detect.outputs.has_flutter }}"

# ─────────────────────────────────────────────
# TIER 1 — Security (always run, all parallel, no stack assumptions)
# ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency CVE Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  lint-workflows:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: actionlint

  trivy-fs:
    name: Trivy Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # ── Step A: Table scan for comment (never fails the job) ──────────────
      - name: Trivy scan (table report for comment)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.SCAN_SEVERITY }}
          exit-code: '0'
          format: table
          output: trivy-report.txt

      # ── Step B (diff mode): Checkout base ref for comparison ──────────────
      - name: Checkout base ref for diff comparison
        if: inputs.trivy_comment_mode == 'diff' && github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trivy-base

      - name: Trivy scan base ref (JSON for diff)
        if: inputs.trivy_comment_mode == 'diff' && github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: trivy-base
          severity: ${{ inputs.SCAN_SEVERITY }}
          exit-code: '0'
          format: json
          output: trivy-base.json

      - name: Trivy scan head ref (JSON for diff)
        if: inputs.trivy_comment_mode == 'diff' && github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.SCAN_SEVERITY }}
          exit-code: '0'
          format: json
          output: trivy-head.json

      # ── Step C: Build Markdown comment body ──────────────────────────────
      - name: Build Trivy comment body
        run: |
          COMMENT_FILE="trivy-comment.md"
          MODE="${{ inputs.trivy_comment_mode }}"

          if [ "$MODE" = "diff" ] && [ -f "trivy-base.json" ] && [ -f "trivy-head.json" ]; then
            base_ids=$(jq -r '.Results[]?.Vulnerabilities[]? | .PkgName + ":::" + .VulnerabilityID' trivy-base.json 2>/dev/null | sort -u || true)
            new_rows=""
            while IFS=$'\t' read -r pkg vuln_id severity title; do
              if ! printf '%s\n' "$base_ids" | grep -qF "${pkg}:::${vuln_id}"; then
                new_rows="${new_rows}| ${pkg} | ${vuln_id} | ${severity} | ${title} |\n"
              fi
            done < <(jq -r '.Results[]?.Vulnerabilities[]? | [.PkgName, .VulnerabilityID, .Severity, (.Title // "N/A")] | @tsv' trivy-head.json 2>/dev/null || true)

            if [ -n "$new_rows" ]; then
              {
                echo "## Trivy — New HIGH/CRITICAL Findings"
                echo ""
                echo "These vulnerabilities were **introduced by this PR**:"
                echo ""
                echo "| Package | CVE | Severity | Title |"
                echo "|---|---|---|---|"
                printf '%b' "$new_rows"
              } > "$COMMENT_FILE"
            else
              {
                echo "## Trivy Security Scan"
                echo "✅ No NEW HIGH/CRITICAL vulnerabilities introduced by this PR."
              } > "$COMMENT_FILE"
            fi
          else
            if grep -qE "^Total: [1-9]" trivy-report.txt 2>/dev/null; then
              {
                echo "## Trivy Security Scan Findings"
                echo ""
                echo '```'
                cat trivy-report.txt
                echo '```'
              } > "$COMMENT_FILE"
            else
              {
                echo "## Trivy Security Scan"
                echo "✅ No HIGH/CRITICAL findings."
              } > "$COMMENT_FILE"
            fi
          fi

      # ── Step D: Post sticky PR comment (skip on forks — token is read-only) ─
      - name: Post Trivy findings comment
        # Comment only on same-repo PRs (the default token can't write to a base repo from a
        # cross-fork PR). NOTE: head.repo.fork is true whenever the repo itself is a fork of an
        # upstream, so compare head/base repo names instead of using !head.repo.fork.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: trivy
          path: trivy-comment.md

      # ── SARIF upload for Security tab (always, independent of gate) ───────
      - name: Trivy SARIF scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.SCAN_SEVERITY }}
          exit-code: '0'
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ── Step E: Gate — fail the job if HIGH/CRITICAL exist ────────────────
      - name: Gate on HIGH/CRITICAL findings
        run: |
          if grep -qE "^Total: [1-9]" trivy-report.txt 2>/dev/null; then
            echo "::error::HIGH or CRITICAL vulnerabilities found. Review the Trivy comment on this PR."
            exit 1
          fi
          echo "No HIGH or CRITICAL findings."

  trivy-config:
    name: Trivy Dockerfile / IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Scan Dockerfiles and IaC configs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: ${{ inputs.SCAN_SEVERITY }}
          exit-code: 0
          format: sarif
          output: trivy-config.sarif

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

# ─────────────────────────────────────────────
# TIER 2 — Coverage (conditional on detected stack, all parallel with each other)
# ─────────────────────────────────────────────
  coverage-java:
    name: Java Coverage → Codecov
    needs: detect
    if: ${{ needs.detect.outputs.has_java == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287  # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}

      - name: Cache Maven repository
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Create Maven settings
        run: |
          cat > $GITHUB_WORKSPACE/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{ secrets.OSSRH_USER }}</username>
                <password>${{ secrets.OSSRH_SECRET }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Run tests and generate coverage
        run: |
          cd ${{ inputs.JAVA_SERVICE_LOCATION }}
          mvn -U -B verify -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=2 \
            --file pom.xml -s $GITHUB_WORKSPACE/settings.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: java
          fail_ci_if_error: true

  coverage-go:
    name: Go Coverage → Codecov
    needs: detect
    if: ${{ needs.detect.outputs.has_go == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: ${{ inputs.GO_SERVICE_LOCATION }}/go.mod
          cache: true

      - name: Run tests and generate coverage
        run: |
          cd ${{ inputs.GO_SERVICE_LOCATION }}
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ${{ inputs.GO_SERVICE_LOCATION }}/coverage.out
          flags: go
          fail_ci_if_error: true

  coverage-npm:
    name: npm Coverage → Codecov
    needs: detect
    if: ${{ needs.detect.outputs.has_npm == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          cd ${{ inputs.NPM_SERVICE_LOCATION }}
          npm ci

      - name: Run tests and generate coverage
        run: |
          cd ${{ inputs.NPM_SERVICE_LOCATION }}
          npm test -- --coverage --watchAll=false

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ${{ inputs.NPM_SERVICE_LOCATION }}/coverage/lcov.info
          flags: npm
          fail_ci_if_error: true

  coverage-android:
    name: Android Coverage → Codecov
    needs: detect
    if: ${{ needs.detect.outputs.has_android == 'true' && needs.detect.outputs.has_java == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287  # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}

      - name: Run Android unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: '**/build/reports/jacoco/**/*.xml'
          flags: android
          fail_ci_if_error: true
